[workspace]
resolver = "2"
members = [
    "casper-event-standard",
    "casper-event-standard-macro",
    "integration-tests",
]

[workspace.package]
version = "0.7.0"
authors = ["Maciej Zieliński <maciej@odra.dev>"]
description = "The smart contract level events for Casper."
edition = "2021"
readme = "./README.md"
repository = "https://github.com/make-software/casper-event-standard"
license = "Apache-2.0"

[workspace.dependencies]
casper-types = "7"
casper-contract = { version = "5", default-features = false }
casper-execution-engine = "9"
casper-engine-test-support = "9"

# casper-engine-test-support 9.x is not published on crates.io yet, and the
# published casper-contract 5.1.1 still requires casper-types 6 - resolve the
# whole casper-node stack from a pinned git revision (dev branch).
[patch.crates-io]
casper-types = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-storage = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-execution-engine = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-engine-test-support = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-contract = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }

